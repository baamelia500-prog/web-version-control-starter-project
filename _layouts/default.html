<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }} &middot; {{ site.title }}</title>
    <meta name="description" content="{{ page.lead | default: site.description }}">

    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- My stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    {% include nav.html %}

    <main class="container">

        <section class="hero">
            <h1>{{ page.heading | default: page.title }}</h1>
            {% if page.lead %}
            <p class="lead">{{ page.lead }}</p>
            {% endif %}
        </section>

        {{ content }}

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Built for a version control class, using Git and GitHub.</p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript. This makes the mobile menu button open and close. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
